<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CW Packing RPG Card Click GAME</title>
<style>
:root{
  --gold:#d7a84a;
  --gold2:#fff0a8;
  --dark:#050505;
  --panel:#111;
  --green:#20c768;
  --red:#ef4444;
  --cream:#fff8dd;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif;
  background:radial-gradient(circle at top,#3a270d,#050505 46%,#000);
  color:var(--cream);
}
.wrap{max-width:1050px;margin:0 auto;padding:14px}
.hero{
  background:linear-gradient(145deg,#17120a,#060606);
  border:1.8px solid rgba(215,168,74,.55);
  border-radius:24px;
  padding:18px;
  box-shadow:0 0 36px rgba(215,168,74,.12);
}
.title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{
  width:52px;height:52px;border-radius:50%;
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold2);font-weight:1000;
}
h1{
  margin:0;
  font-size:31px;
  line-height:1.05;
  font-weight:1000;
  background:linear-gradient(90deg,#fff8d6,#d7a84a,#fff8d6);
  -webkit-background-clip:text;
  color:transparent;
}
.badge{
  margin-left:auto;
  padding:11px 16px;
  border-radius:16px;
  background:linear-gradient(135deg,#5d4214,#1b1205);
  border:1px solid rgba(255,240,168,.45);
  font-weight:1000;
}
.sub{margin-top:10px;color:var(--gold2);font-weight:900}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.stat{
  border:1px solid rgba(215,168,74,.4);
  border-radius:18px;
  padding:12px;
  text-align:center;
  background:rgba(255,255,255,.035);
  color:#d8c99a;
}
.stat strong{display:block;color:var(--gold2);font-size:24px;margin-top:4px}
.progress{height:12px;background:#211808;border-radius:999px;overflow:hidden;margin-top:12px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#8b641d,#fff0a8,#d7a84a);transition:.35s}

.stage{
  margin-top:16px;
  background:linear-gradient(145deg,#111,#050505);
  border:1.8px solid rgba(215,168,74,.45);
  border-radius:26px;
  padding:16px;
}
.stage-title{
  font-size:22px;
  font-weight:1000;
  color:var(--gold2);
  margin-bottom:12px;
}
.game-layout{
  display:grid;
  grid-template-columns:170px 1fr;
  gap:14px;
}
.left{
  position:relative;
  border:1px solid rgba(215,168,74,.45);
  border-radius:22px;
  padding:10px;
  background:#090909;
  min-height:560px;
}
.road{
  position:absolute;
  top:20px;bottom:20px;left:50%;
  width:7px;
  transform:translateX(-50%);
  background:linear-gradient(#d7a84a,#fff0a8,#d7a84a);
  border-radius:999px;
  opacity:.8;
}
.prince{
  position:absolute;
  top:26px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  z-index:10;
  transition:top .4s ease;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.6));
}
.prince:after{
  content:"👑";
  position:absolute;
  top:-15px;
  right:-8px;
  font-size:17px;
}
.nodes{position:relative;z-index:4}
.node{
  height:62px;
  width:120px;
  margin:0 auto 13px;
  border-radius:17px;
  border:1px solid rgba(215,168,74,.45);
  background:linear-gradient(145deg,#15100a,#060606);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:.2s;
  font-weight:1000;
}
.node .emoji{font-size:21px}
.node .txt{font-size:12px;color:#dccb94;margin-top:2px}
.node.active{
  border-color:var(--gold2);
  box-shadow:0 0 0 3px rgba(255,240,168,.12),0 0 22px rgba(255,240,168,.25);
}
.node.done{
  background:linear-gradient(145deg,#12351f,#06120a);
  border-color:rgba(32,199,104,.75);
}
.node.done:after{
  content:"✓";
  position:absolute;
  transform:translate(52px,-26px);
  background:var(--green);
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:white;
}

.right{
  min-height:560px;
  border-radius:22px;
  border:1px solid rgba(215,168,74,.4);
  background:
    linear-gradient(90deg,rgba(215,168,74,.07) 1px,transparent 1px),
    linear-gradient(rgba(215,168,74,.07) 1px,transparent 1px),
    linear-gradient(145deg,#161616,#070707);
  background-size:42px 42px;
  padding:16px;
}
.task-card{
  border-radius:20px;
  border:1px solid rgba(215,168,74,.45);
  background:rgba(0,0,0,.42);
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.task-title{
  color:var(--gold2);
  font-size:23px;
  font-weight:1000;
  margin-bottom:6px;
}
.task-desc{
  font-size:14px;
  color:#e7d8a5;
  font-weight:800;
}
.item-row{
  margin-top:18px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.item{
  min-height:122px;
  border-radius:20px;
  border:1px solid rgba(215,168,74,.45);
  background:linear-gradient(145deg,#20170b,#080808);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  position:relative;
  transition:.25s;
  box-shadow:0 8px 18px rgba(0,0,0,.35);
}
.item:hover{transform:translateY(-5px) scale(1.02);border-color:var(--gold2)}
.item.done{
  background:linear-gradient(145deg,#12351f,#07140b);
  border-color:rgba(32,199,104,.85);
  box-shadow:0 0 0 3px rgba(32,199,104,.12),0 8px 18px rgba(0,0,0,.35);
}
.item .ico{font-size:42px}
.item .label{font-weight:1000;text-align:center;margin-top:9px;font-size:15px}
.item .status{
  position:absolute;
  top:9px;
  right:9px;
  border-radius:999px;
  padding:4px 9px;
  background:linear-gradient(135deg,#8b641d,#fff0a8);
  color:#111;
  font-size:12px;
  font-weight:1000;
}
.item.done .status{
  background:var(--green);
  color:#fff;
}
.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}
button{
  border:none;
  border-radius:14px;
  padding:13px 16px;
  font-size:15px;
  font-weight:1000;
  cursor:pointer;
}
.goldBtn{background:linear-gradient(135deg,#8b641d,#fff0a8,#d7a84a);color:#111}
.darkBtn{background:#111827;color:white;border:1px solid rgba(215,168,74,.4)}
.redBtn{background:#9f1239;color:white}
.message{
  margin-top:14px;
  padding:12px;
  border-radius:16px;
  border:1px solid rgba(215,168,74,.35);
  color:var(--gold2);
  font-weight:1000;
  background:rgba(0,0,0,.35);
}
.balloon{
  position:fixed;
  left:50%;
  bottom:-70px;
  transform:translateX(-50%);
  z-index:9999;
  font-size:34px;
  animation:balloonUp 1.5s ease-out forwards;
}
@keyframes balloonUp{
  0%{bottom:-70px;opacity:0;transform:translateX(-50%) scale(.7)}
  20%{opacity:1}
  100%{bottom:78%;opacity:0;transform:translateX(-50%) scale(1.25)}
}
@media(max-width:800px){
  .game-layout{grid-template-columns:1fr}
  .left{min-height:auto;display:flex;overflow-x:auto;gap:10px}
  .road,.prince{display:none}
  .nodes{display:flex;gap:10px}
  .node{min-width:115px;margin:0}
  .item-row{grid-template-columns:repeat(2,1fr)}
  h1{font-size:24px}
  .badge{margin-left:0}
  .stats{grid-template-columns:1fr 1fr}
}

.parade{
position:fixed;
left:-30%;
bottom:18%;
font-size:44px;
z-index:9998;
animation:paradeMove 3.2s linear forwards;
white-space:nowrap;
filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));
}
@keyframes paradeMove{
0%{left:-30%;opacity:0}
10%{opacity:1}
100%{left:120%;opacity:0}
}


.starfall{
position:fixed;
top:-40px;
font-size:26px;
z-index:9999;
animation:starDrop 2.2s linear forwards;
filter:drop-shadow(0 0 8px rgba(255,240,168,.65));
}
@keyframes starDrop{
0%{transform:translateY(-40px) rotate(0deg);opacity:0}
10%{opacity:1}
100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}


.intro-screen{
position:fixed;
inset:0;
z-index:10000;
background:
 radial-gradient(circle at top,#4b3510 0,#090909 42%,#000 100%);
display:flex;
align-items:center;
justify-content:center;
padding:24px;
animation:introOut .7s ease forwards;
animation-delay:4s;
}
.intro-inner{
max-width:760px;
width:100%;
text-align:center;
border:2px solid rgba(255,240,168,.55);
border-radius:32px;
padding:28px 22px;
background:linear-gradient(145deg,rgba(12,12,12,.96),rgba(39,27,8,.94));
box-shadow:0 0 60px rgba(215,168,74,.25), inset 0 0 0 1px rgba(255,240,168,.12);
}
.intro-logo{
width:100px;
height:100px;
border-radius:50%;
margin:0 auto 18px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:1000;
color:#fff0a8;
border:2px solid #d7a84a;
background:radial-gradient(circle,#5d4214,#060606);
box-shadow:0 0 28px rgba(255,240,168,.35);
opacity:0;
animation:dropIn .75s ease forwards;
}
.intro-img{
width:min(420px,90%);
max-height:250px;
object-fit:contain;
border-radius:20px;
background:#fff;
padding:10px;
margin:0 auto 18px;
display:block;
box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 24px rgba(255,240,168,.18);
opacity:1 !important;
position:relative;
animation:none !important;
transform:none !important;
}
.intro-title{
font-size:clamp(28px,5vw,48px);
line-height:1.08;
font-weight:1000;
letter-spacing:.4px;
background:linear-gradient(90deg,#fff8d6,#d7a84a,#fff0a8,#d7a84a);
-webkit-background-clip:text;
color:transparent;
opacity:0;
animation:dropIn .75s ease forwards;
animation-delay:1.3s;
}
.intro-sub{
margin-top:16px;
font-size:clamp(16px,3vw,22px);
font-weight:950;
color:#fff0a8;
opacity:0;
animation:dropIn .75s ease forwards;
animation-delay:2.05s;
}
.intro-step{
margin-top:12px;
font-size:15px;
font-weight:900;
color:#d8c99a;
opacity:0;
animation:dropIn .75s ease forwards;
animation-delay:2.7s;
}
@keyframes dropIn{
0%{opacity:0;transform:translateY(-35px) scale(.96)}
100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes introOut{
to{opacity:0;visibility:hidden;pointer-events:none}
}


.cw-main-logo{
width:140px;
height:140px;
object-fit:cover;
display:block;
margin:0 auto 18px;
border-radius:50%;
border:2px solid rgba(255,240,168,.55);
padding:8px;
background:radial-gradient(circle,#2a1d08,#050505);
filter:drop-shadow(0 0 12px rgba(255,215,120,.20));
opacity:0;
animation:
  dropIn .75s ease forwards,
  logoGlow 2.8s ease-in-out infinite;
animation-delay:.2s,1s;
box-shadow:
0 0 22px rgba(255,240,168,.18),
inset 0 0 18px rgba(255,240,168,.08);
}
@keyframes logoGlow{
0%,100%{
filter:
drop-shadow(0 0 8px rgba(255,215,120,.18))
drop-shadow(0 0 16px rgba(255,215,120,.12));
transform:scale(1);
}
50%{
filter:
drop-shadow(0 0 18px rgba(255,230,160,.55))
drop-shadow(0 0 42px rgba(255,215,120,.38));
transform:scale(1.03);
}
}
.intro-title{
text-transform:none;
}


.intro-loading-wrap{
margin-top:22px;
opacity:0;
animation:dropIn .75s ease forwards;
animation-delay:2.7s;
}
.intro-loading-text{
font-size:14px;
font-weight:1000;
letter-spacing:2px;
color:#fff0a8;
margin-bottom:10px;
}
.intro-loading-bar{
width:min(420px,88%);
height:14px;
margin:0 auto;
background:rgba(255,255,255,.08);
border-radius:999px;
overflow:hidden;
border:1px solid rgba(255,240,168,.28);
box-shadow:inset 0 0 10px rgba(0,0,0,.45);
}
.intro-loading-fill{
height:100%;
width:0%;
border-radius:999px;
background:linear-gradient(90deg,#8b641d,#fff0a8,#d7a84a);
box-shadow:0 0 18px rgba(255,240,168,.45);
animation:introLoad 4s linear forwards;
}
@keyframes introLoad{
from{width:0%}
to{width:100%}
}

</style>
</head>

}
function renderTask(){
  const s = stages[active];
  document.getElementById('taskTitle').innerText = s.title;
  document.getElementById('taskDesc').innerText = s.desc;
  document.getElementById('itemRow').innerHTML = s.items.map((it,idx)=>{
    const key = active + '-' + idx;
    const done = doneItems[key];
    return `
      <div class="item ${done?'done':''}" onclick="clickItem(${idx})">
        <div class="status">${done?'완성':'클릭'}</div>
        <div class="ico">${it[0]}</div>
        <div class="label">${it[1]}</div>
      </div>
    `;
  }).join('');
}
function clickItem(idx){
  const key = active + '-' + idx;
  if(!doneItems[key]){
    doneItems[key] = true;
    score += 50;
    oneBalloon();
  }
  const allDone = stages[active].items.every((_,i)=>doneItems[active+'-'+i]);
  if(allDone){
    doneStages.add(active); parade(); starShower();
    document.getElementById('message').innerText = '✅ 이 단계가 완성되었습니다. 다음 단계로 이동합니다.';
    setTimeout(()=>{
      if(active < stages.length-1) active++;
      render();
    }, 550);
  }else{
    document.getElementById('message').innerText = '좋아요. 다음 아이템을 클릭하세요.';
    renderTask();
    updateStats();
  }
}
function completeStage(){
  stages[active].items.forEach((_,i)=>doneItems[active+'-'+i]=true);
  doneStages.add(active);
  score += 100;
  oneBalloon();
  setTimeout(()=>{
    if(active < stages.length-1) active++;
    render();
  }, 450);
  render();
}
function nextStage(){
  if(active < stages.length-1) active++;
  render();
}
function goStage(i){
  active = i;
  render();
}
function resetAll(){
  active = 0;
  doneStages.clear();
  doneItems = {};
  score = 0;
  document.getElementById('message').innerText = '아이템 카드를 클릭하면 완성 표시가 붙습니다.';
  render();
}
function updateStats(){
  document.getElementById('score').innerText = score;
  document.getElementById('stepCount').innerText = `${doneStages.size} / ${stages.length}`;
  document.getElementById('state').innerText = doneStages.size === stages.length ? '포장 완료' : '진행 중';
  document.getElementById('bar').style.width = (doneStages.size / stages.length * 100) + '%';
}


function starShower(){
 for(let i=0;i<14;i++){
   const s=document.createElement('div');
   s.className='starfall';
   s.innerText='⭐';
   s.style.left=(Math.random()*100)+'vw';
   s.style.animationDelay=(Math.random()*0.5)+'s';
   document.body.appendChild(s);
   setTimeout(()=>s.remove(),2400);
 }
}

function parade(){
 const p=document.createElement('div');
 p.className='parade';
 p.innerText='🏇 🎉 👑 ✨ 🛍️ 🎊';
 document.body.appendChild(p);
 setTimeout(()=>p.remove(),3200);
}

function oneBalloon(){
  const b = document.createElement('div');
  b.className = 'balloon';
  b.innerText = '🎈';
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),1500);
}
render();
</script>
</body>
</html>
